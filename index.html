<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soapayuca OS - Tech Pastel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Nunito:wght@400;900&display=swap');
        
        /* Paleta Tech-Pastel y Naranja de Seguridad */
        :root { 
            --safety-orange: #ff6b00; 
            --pastel-bg: #fdfbf7; 
            --pastel-panel: #ffffff;
            --text-main: #2d3748;
        }
        
        body { margin: 0; overflow: hidden; background-color: var(--pastel-bg); color: var(--text-main); font-family: 'Nunito', sans-serif; }
        
        /* Contenedores con Alta Luminosidad */
        .viewport { height: 65vh; position: relative; overflow: hidden; background: #f0f4f8; border-bottom: 8px solid var(--safety-orange); }
        .terminal { height: 35vh; background: var(--pastel-panel); padding: 25px; font-family: 'Fira Code', monospace; overflow-y: auto; box-shadow: 0 -10px 20px rgba(0,0,0,0.05); }
        
        .guide-overlay { position: absolute; font-size: 25vw; opacity: 0.15; color: var(--safety-orange); font-weight: 900; pointer-events: none; }
        .popup-obj { position: absolute; width: 380px; border-radius: 35px; border: 8px solid white; z-index: 100; animation: vroom 2.8s linear forwards; box-shadow: 0 10px 25px rgba(255,107,0,0.2); }
        @keyframes vroom { from { left: -500px; } to { left: 115%; } }
        
        .fx-layer { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 50; }
        .smoke { background: rgba(200,200,200,0.6); animation: flicker 0.2s infinite; }
        .water { background: linear-gradient(to bottom, transparent, rgba(160, 216, 239, 0.5)); }
        @keyframes flicker { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>

    <!-- ACCESO BIOMÉTRICO -->
    <div id="lock" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center text-center p-4" style="background-color: var(--pastel-bg);">
        <h1 class="text-6xl font-black mb-2 italic text-gray-800">ECOSAVE <span class="text-orange-500">SYSTEMS</span></h1>
        <p class="text-gray-500 font-bold mb-8 tracking-widest uppercase">División Industrial y Soapayuca</p>
        
        <div id="cam-area" class="hidden w-72 h-72 rounded-full border-8 border-orange-500 overflow-hidden mb-10 shadow-[0_10px_40px_rgba(255,107,0,0.3)] bg-white">
            <video id="webcam" autoplay muted playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
        </div>
        
        <p id="auth-msg" class="text-orange-500 text-2xl font-black animate-pulse mb-8 italic uppercase">Esperando Identificación...</p>
        
        <button onclick="solicitarAcceso()" class="bg-orange-500 hover:bg-orange-600 text-white px-16 py-8 rounded-3xl font-black text-3xl uppercase transition-all shadow-xl active:scale-95">
            Identificar André
        </button>
    </div>
    <canvas id="pic" class="hidden"></canvas>

    <!-- INTERFAZ PRINCIPAL -->
    <div class="flex flex-col h-screen">
        <div class="viewport" id="stage">
            <div id="fx" class="fx-layer"></div>
            <div id="guide" class="guide-overlay inset-0 flex items-center justify-center"></div>
            <div id="main-view" class="h-full flex items-center justify-center text-[15rem] drop-shadow-xl transition-all">🤠</div>
        </div>

        <div class="terminal">
            <div class="flex justify-between items-center border-b-4 border-orange-200 pb-4 mb-4">
                <div class="flex flex-col">
                    <span class="text-gray-400 text-xs font-bold uppercase tracking-wider">Estado de Operación</span>
                    <div id="task" class="text-orange-500 font-black text-4xl italic">SISTEMA INICIADO</div>
                </div>
                <div class="bg-orange-50 border-2 border-orange-500 px-8 py-4 rounded-2xl shadow-sm">
                    <span class="text-orange-600 font-black text-3xl" id="xp">0</span>
                    <span class="text-orange-400 font-bold ml-2">XP</span>
                </div>
            </div>
            <div id="console" class="text-gray-600 text-xl font-medium h-32 overflow-y-auto"></div>
        </div>
    </div>

    <!-- CÓDIGO MAESTRO -->
    <script>
        let stream, points = 0, target = "ANDRE", idx = 0;
        const main = document.getElementById('main-view');
        const fx = document.getElementById('fx');
        const log = document.getElementById('console');

        function speak(t) { 
            window.speechSynthesis.cancel(); 
            const m = new SpeechSynthesisUtterance(t); 
            m.lang='es-MX'; 
            m.rate=1; 
            window.speechSynthesis.speak(m); 
        }
        
        function print(t) { 
            log.innerHTML = `<span class="text-orange-500 font-bold">></span> ${t}<br>${log.innerHTML}`; 
        }

        async function solicitarAcceso() {
            if(!stream) {
                stream = await navigator.mediaDevices.getUserMedia({video:true});
                document.getElementById('webcam').srcObject = stream;
                document.getElementById('cam-area').classList.remove('hidden');
                document.getElementById('auth-msg').innerText = "CÁMARA ACTIVADA. PRESIONA ENTER.";
                speak("Mire a la cámara para iniciar.");
            } else {
                const video = document.getElementById('webcam'), c = document.getElementById('pic');
                c.width = video.videoWidth; c.height = video.videoHeight;
                c.getContext('2d').drawImage(video, 0, 0);
                const d = document.createElement('a'); 
                d.href = c.toDataURL('image/jpeg'); 
                d.download = 'Ingeniero_Andre_Perfil.jpg'; 
                d.click();
                
                document.getElementById('lock').classList.add('hidden');
                speak("Acceso concedido. Mando central activado.");
                siguienteReto();
            }
        }

        function siguienteReto() {
            const m = ["ANDRE", "CABALLO", "ASBESTO", "GASES", "RESIDUOS", "QUITOSANO", "JETTA", "MAZDA", "BUICK", "PICKUP", "1234", "SOPA"];
            target = m[Math.floor(Math.random() * m.length)];
            idx = 0;
            document.getElementById('task').innerText = target;
            document.getElementById('guide').innerText = target[0];
            speak("Comando: " + target);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !document.getElementById('lock').classList.contains('hidden')) { 
                solicitarAcceso(); 
                return; 
            }
            
            const k = e.key.toUpperCase();

            // 1. APRENDIZAJE
            if (k === target[idx] || e.key === target[idx]) {
                idx++; 
                speak(e.key);
                if (idx >= target.length) {
                    points += 100; 
                    document.getElementById('xp').innerText = points;
                    speak("¡Excelente trabajo!"); 
                    print(`MISIÓN [${target}] LOGRADA`); 
                    siguienteReto();
                } else { 
                    document.getElementById('guide').innerText = target[idx]; 
                }
            }

            // 2. INDUSTRIAL
            if (k === 'A') { speak("Remoción de Asbesto."); main.innerText = "🏗️⚠️"; runFX('smoke'); }
            if (k === 'G') { speak("Gases Refrigerantes."); main.innerText = "💨🔋"; }
            if (k === 'Q') { speak("Aplicando Quitosano."); main.innerText = "🧪💧"; }
            if (k === 'P') { speak("Residuos Peligrosos."); main.innerText = "☢️📦"; }

            // 3. FAMILIA
            if (k === 'R') { speak("Ricardo, Jetta negro."); spawn('jetta.jpg', '🚗'); }
            if (k === 'K') { speak("Kike, Buick dorada."); spawn('buick.jpg', '🚙'); }
            if (k === 'T') { speak("Tony, pick up blanca."); spawn('pickup.jpg', '🛻'); }
            if (k === 'M') { speak("Mazda de Mamá."); spawn('mazda.jpg', '🏎️'); }
            
            // 4. RUTINAS
            if (k === 'V') { speak("¡Arre vaquero!"); main.innerText = "🤠🐎"; }
            if (k === 'D') { speak("Rescate de dinosaurio."); main.innerText = "🦕💦"; runFX('water'); }
            if (k === 'S') { speak("Sopa lista."); main.innerText = "🥣"; }
            if (e.code === 'Space') { speak("Caballo a la fuente."); spawn('', '🐴💦'); }
        });

        function runFX(t) { 
            fx.className = `fx-layer ${t}`; 
            fx.style.display = 'block'; 
            setTimeout(() => fx.style.display = 'none', 3000); 
        }
        
        function spawn(i, e) {
            const o = document.createElement('div'); 
            o.className = 'popup-obj';
            o.style.top = (Math.random() * 40 + 10) + '%';
            o.innerHTML = i ? `<img src="${i}" style="width:100%" onerror="this.outerHTML='<span style=\'font-size:200px\'>${e}</span>'">` : `<span style="font-size:200px">${e}</span>`;
            document.getElementById('stage').appendChild(o);
            setTimeout(() => o.remove(), 2800);
        }
    </script>
</body>
</html>
