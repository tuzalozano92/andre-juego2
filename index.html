<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soapayuca Academy V14 - Total Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Nunito:wght@400;900&display=swap');
        body { margin: 0; overflow: hidden; background: #1a1a1a; color: #4af626; font-family: 'Nunito', sans-serif; }
        .canvas { height: 60vh; position: relative; overflow: hidden; background: #222; border-bottom: 4px solid #444; }
        .terminal { height: 40vh; background: #000; padding: 20px; font-family: 'Fira Code', monospace; overflow-y: auto; }
        
        /* Animación de los Coches */
        .car-img { position: absolute; width: 350px; border-radius: 25px; border: 6px solid white; z-index: 100; animation: vroom 2.5s linear forwards; }
        @keyframes vroom { from { left: -500px; } to { left: 110%; } }
        
        /* Letra de Guía Gigante */
        .guide-char { position: absolute; font-size: 25vw; opacity: 0.1; color: white; font-weight: 900; pointer-events: none; }
        
        /* Efecto Cascada */
        .waterfall { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent, rgba(0, 210, 255, 0.2)); pointer-events: none; display: none; }
    </style>
</head>
<body>
    <!-- PANTALLA DE INICIO -->
    <div id="login" class="fixed inset-0 bg-black z-[200] flex flex-col items-center justify-center text-center">
        <h1 class="text-5xl font-black text-white mb-4 italic">SOAPAYUCA <span class="text-blue-500">ADVENTURE</span></h1>
        <p class="text-gray-400 mb-8 text-xl">INGENIERO ANDRÉ: ACCESO AL SISTEMA</p>
        <button onclick="iniciarSistema()" class="bg-orange-600 hover:bg-orange-50 text-white hover:text-orange-600 px-16 py-8 rounded-full font-black text-3xl transition-all animate-bounce shadow-2xl">INICIAR SESIÓN</button>
    </div>

    <div class="canvas" id="canvas">
        <div id="water" class="waterfall"></div>
        <div id="guide" class="guide-char inset-0 flex items-center justify-center"></div>
        <div id="visual-area" class="h-full flex flex-col items-center justify-center text-9xl transition-all">🤠</div>
    </div>

    <div class="terminal" id="term">
        <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-2">
            <div class="text-yellow-400 font-black text-2xl" id="mission-title">CARGANDO ACADEMIA...</div>
            <div class="text-white font-bold bg-green-900 px-3 py-1 rounded">XP: <span id="xp-points">0</span></div>
        </div>
        <div id="output" class="text-green-500 text-lg"></div>
    </div>

    <script>
        let xp = 0, currentTarget = "ANDRE", charIdx = 0;
        const visual = document.getElementById('visual-area');
        const water = document.getElementById('water');
        
        function hablar(m) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(m); u.lang='es-MX'; u.rate=1; window.speechSynthesis.speak(u); }
        function log(m) { const d = document.getElementById('output'); d.innerHTML = `<span class="text-blue-400">>></span> ${m}<br>${d.innerHTML}`; }

        function iniciarSistema() {
            document.getElementById('login').style.display = 'none';
            hablar("Ingeniero André, bienvenido a su academia en la Hacienda. Vamos a programar.");
            nuevaMision();
        }

        function nuevaMision() {
            const misiones = ["ANDRE", "CABALLO", "HONGO", "1234", "5678", "JETTA", "MAZDA", "BUICK", "PICKUP"];
            currentTarget = misiones[Math.floor(Math.random() * misiones.length)];
            charIdx = 0;
            document.getElementById('mission-title').innerText = `MISIÓN: ESCRIBE "${currentTarget}"`;
            document.getElementById('guide').innerText = currentTarget[0];
            hablar("Escribe la palabra o el número: " + currentTarget);
        }

        window.addEventListener('keydown', (e) => {
            const tecla = e.key.toUpperCase();
            
            // 1. LÓGICA DE APRENDIZAJE (Letras y Números)
            if (tecla === currentTarget[charIdx] || e.key === currentTarget[charIdx]) {
                charIdx++;
                hablar(e.key);
                if (charIdx >= currentTarget.length) {
                    xp += 50;
                    document.getElementById('xp-points').innerText = xp;
                    hablar("¡Excelente trabajo Ingeniero!");
                    log(`COMPLETADO: ${currentTarget} (+50 XP)`);
                    nuevaMision();
                } else {
                    document.getElementById('guide').innerText = currentTarget[charIdx];
                }
            }

            // 2. COMANDOS DE LA HACIENDA (Toda la experiencia)
            
            // Los Coches de la familia
            if (tecla === 'R') { hablar("la R de Ricardo el Jetta negro"); lanzarObjeto('jetta.jpg', '🚗'); }
            if (tecla === 'K') { hablar("K de Kike Buick dorada"); lanzarObjeto('buick.jpg', '🚙'); }
            if (tecla === 'T') { hablar("T de Tony de la pick up blanca"); lanzarObjeto('pickup.jpg', '🛻'); }
            if (tecla === 'M') { hablar("M de Mazda de Mamá"); lanzarObjeto('mazda.jpg', '🏎️'); }
            
            // Aventuras y Rescates
            if (tecla === 'D') { 
                hablar("Rescatando dinosaurio de la cascada"); 
                visual.innerText = "🦕💦"; 
                water.style.display = 'block';
                setTimeout(() => water.style.display = 'none', 3000);
            }
            if (tecla === 'S') { 
                hablar("Preparando tu sopa favorita con fideos y verduras"); 
                visual.innerText = "🥣"; 
            }
            if (tecla === 'V') { 
                hablar("¡Arre vaquero! Galopando por Soapayuca"); 
                visual.innerText = "🤠🐎"; 
            }
            if (e.code === 'Space') { 
                hablar("¡Caballo a la fuente! Splash"); 
                lanzarObjeto('', '🐴💦'); 
            }
        });

        function lanzarObjeto(src, emoji) {
            const obj = document.createElement('div');
            obj.className = 'car-img';
            obj.style.top = Math.random() * 30 + 10 + '%';
            if (src) {
                obj.innerHTML = `<img src="${src}" style="width:100%" onerror="this.outerHTML='<span style=\'font-size:150px\'>${emoji}</span>'">`;
            } else {
                obj.innerHTML = `<span style="font-size:150px">${emoji}</span>`;
            }
            document.getElementById('canvas').appendChild(obj);
            setTimeout(() => obj.remove(), 2600);
        }
    </script>
</body>
</html>
