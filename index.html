<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soapayuca Industrial OS - Ingeniero André</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Nunito:wght@400;900&display=swap');
        :root { --safety-orange: #ff6b00; --sky-blue: #00d2ff; }
        body { margin: 0; overflow: hidden; background-color: #000; color: var(--safety-orange); font-family: 'Nunito', sans-serif; }
        
        /* Contenedores */
        .viewport { height: 65vh; position: relative; overflow: hidden; background: #121212; border-bottom: 6px solid var(--safety-orange); }
        .terminal { height: 35vh; background: #000; padding: 25px; font-family: 'Fira Code', monospace; overflow-y: auto; }
        
        /* Elementos Visuales */
        .guide-overlay { position: absolute; font-size: 25vw; opacity: 0.15; color: white; font-weight: 900; pointer-events: none; }
        .popup-obj { position: absolute; width: 380px; border-radius: 35px; border: 8px solid white; z-index: 100; animation: vroom 2.8s linear forwards; box-shadow: 0 0 30px rgba(255,255,255,0.3); }
        @keyframes vroom { from { left: -500px; } to { left: 115%; } }
        
        /* Efectos Ecosave */
        .fx-layer { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 50; }
        .smoke { background: rgba(100,100,100,0.4); animation: flicker 0.2s infinite; }
        .water { background: linear-gradient(to bottom, transparent, rgba(0, 150, 255, 0.3)); }
        @keyframes flicker { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. PANTALLA DE ACCESO BIOMÉTRICO           -->
    <!-- ========================================== -->
    <div id="lock" class="fixed inset-0 bg-black z-[1000] flex flex-col items-center justify-center text-center p-4">
        <h1 class="text-6xl font-black text-white mb-2 italic">SOAPAYUCA <span class="text-orange-500">OS</span></h1>
        <p class="text-gray-500 font-bold mb-8 tracking-widest uppercase">División Industrial y Ecuestre</p>
        
        <div id="cam-area" class="hidden w-72 h-72 rounded-full border-8 border-orange-500 overflow-hidden mb-10 shadow-[0_0_50px_rgba(255,107,0,0.4)]">
            <video id="webcam" autoplay muted playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
        </div>
        
        <p id="auth-msg" class="text-orange-400 text-2xl font-black animate-pulse mb-8 italic uppercase">Esperando Identificación del Ingeniero...</p>
        
        <button onclick="solicitarAcceso()" class="bg-orange-600 hover:bg-white text-white hover:text-orange-600 px-16 py-8 rounded-3xl font-black text-3xl uppercase transition-all shadow-2xl active:scale-95">
            Identificar André
        </button>
    </div>
    <canvas id="pic" class="hidden"></canvas>

    <!-- ========================================== -->
    <!-- 2. INTERFAZ PRINCIPAL DEL JUEGO            -->
    <!-- ========================================== -->
    <div class="flex flex-col h-screen">
        
        <!-- Pantalla de Visualización -->
        <div class="viewport" id="stage">
            <div id="fx" class="fx-layer"></div>
            <div id="guide" class="guide-overlay inset-0 flex items-center justify-center"></div>
            <div id="main-view" class="h-full flex items-center justify-center text-[15rem] drop-shadow-2xl transition-all">🤠</div>
        </div>

        <!-- Consola de Comandos -->
        <div class="terminal">
            <div class="flex justify-between items-center border-b-4 border-orange-900 pb-4 mb-4">
                <div class="flex flex-col">
                    <span class="text-gray-600 text-xs font-bold uppercase">Estado de la Misión</span>
                    <div id="task" class="text-orange-500 font-black text-4xl italic">SISTEMA LISTO</div>
                </div>
                <div class="bg-orange-950 border-2 border-orange-500 px-8 py-4 rounded-2xl">
                    <span class="text-white font-black text-3xl" id="xp">0</span>
                    <span class="text-orange-400 font-bold ml-2">XP</span>
                </div>
            </div>
            <div id="console" class="text-gray-400 text-xl italic h-32 overflow-y-auto"></div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. LÓGICA Y CÓDIGO DE PROGRAMACIÓN         -->
    <!-- ========================================== -->
    <script>
        let stream, points = 0, target = "ANDRE", idx = 0;
        const main = document.getElementById('main-view');
        const fx = document.getElementById('fx');
        const log = document.getElementById('console');

        // Funciones de audio y texto
        function speak(t) { 
            window.speechSynthesis.cancel(); 
            const m = new SpeechSynthesisUtterance(t); 
            m.lang='es-MX'; 
            m.rate=1; 
            window.speechSynthesis.speak(m); 
        }
        
        function print(t) { 
            log.innerHTML = `<span class="text-orange-600">></span> ${t}<br>${log.innerHTML}`; 
        }

        // Sistema de Cámara
        async function solicitarAcceso() {
            if(!stream) {
                stream = await navigator.mediaDevices.getUserMedia({video:true});
                document.getElementById('webcam').srcObject = stream;
                document.getElementById('cam-area').classList.remove('hidden');
                document.getElementById('auth-msg').innerText = "CÁMARA ACTIVADA. PRESIONA ENTER.";
                speak("Mire a la cámara, Ingeniero André.");
            } else {
                const video = document.getElementById('webcam'), c = document.getElementById('pic');
                c.width = video.videoWidth; c.height = video.videoHeight;
                c.getContext('2d').drawImage(video, 0, 0);
                const d = document.createElement('a'); 
                d.href = c.toDataURL('image/jpeg'); 
                d.download = 'Ingeniero_Andre_Perfil.jpg'; 
                d.click();
                
                document.getElementById('lock').classList.add('hidden');
                speak("Acceso concedido. Bienvenido a su mando central, Ingeniero.");
                siguienteReto();
            }
        }

        // Sistema de Misiones (Palabras y Números)
        function siguienteReto() {
            const m = ["ANDRE", "CABALLO", "ASBESTO", "GASES", "RESIDUOS", "QUITOSANO", "JETTA", "MAZDA", "BUICK", "PICKUP", "1234"];
            target = m[Math.floor(Math.random() * m.length)];
            idx = 0;
            document.getElementById('task').innerText = target;
            document.getElementById('guide').innerText = target[0];
            speak("Comando solicitado: " + target);
        }

        // Detectar Teclas
        window.addEventListener('keydown', (e) => {
            // Permitir que la tecla Enter tome la foto
            if (e.key === 'Enter' && !document.getElementById('lock').classList.contains('hidden')) { 
                solicitarAcceso(); 
                return; 
            }
            
            const k = e.key.toUpperCase();

            // LÓGICA 1: Escribir la palabra de la misión
            if (k === target[idx] || e.key === target[idx]) {
                idx++; 
                speak(e.key);
                if (idx >= target.length) {
                    points += 100; 
                    document.getElementById('xp').innerText = points;
                    speak("¡Excelente trabajo, misión cumplida!"); 
                    print(`MISIÓN [${target}] LOGRADA EXITOSAMENTE`); 
                    siguienteReto();
                } else { 
                    document.getElementById('guide').innerText = target[idx]; 
                }
            }

            // LÓGICA 2: Comandos Industriales ECOSAVE MX
            if (k === 'A') { speak("Remoción de Asbesto en proceso."); main.innerText = "🏗️⚠️"; runFX('smoke'); }
            if (k === 'G') { speak("Gestión de Gases Refrigerantes activada."); main.innerText = "💨🔋"; }
            if (k === 'Q') { speak("Aplicando Quitosano. Agua purificada."); main.innerText = "🧪💧"; }
            if (k === 'P') { speak("Residuos Peligrosos asegurados."); main.innerText = "☢️📦"; }

            // LÓGICA 3: Vehículos Familiares
            if (k === 'R') { speak("Ricardo en su Jetta negro."); spawn('jetta.jpg', '🚗'); }
            if (k === 'K') { speak("Kike en la Buick dorada."); spawn('buick.jpg', '🚙'); }
            if (k === 'T') { speak("Tony en la pick up blanca."); spawn('pickup.jpg', '🛻'); }
            if (k === 'M') { speak("Mamá en el Mazda."); spawn('mazda.jpg', '🏎️'); }
            
            // LÓGICA 4: Aventuras y Rutinas del Ingeniero
            if (k === 'V') { speak("¡Arre vaquero! Paseo por la hacienda."); main.innerText = "🤠🐎"; }
            if (k === 'D') { speak("Rescate de dinosaurio en la cascada."); main.innerText = "🦕💦"; runFX('water'); }
            if (k === 'S') { speak("Su sopa favorita está servida, Ingeniero."); main.innerText = "🥣"; }
            if (e.code === 'Space') { speak("¡Splash! Llevando al caballo a la fuente."); spawn('', '🐴💦'); }
        });

        // Utilidades Visuales
        function runFX(t) { 
            fx.className = `fx-layer ${t}`; 
            fx.style.display = 'block'; 
            setTimeout(() => fx.style.display = 'none', 3000); 
        }
        
        function spawn(i, e) {
            const o = document.createElement('div'); 
            o.className = 'popup-obj';
            o.style.top = (Math.random() * 40 + 10) + '%';
            o.innerHTML = i ? `<img src="${i}" style="width:100%" onerror="this.outerHTML='<span style=\'font-size:200px\'>${e}</span>'">` : `<span style="font-size:200px">${e}</span>`;
            document.getElementById('stage').appendChild(o);
            setTimeout(() => o.remove(), 2800);
        }
    </script>
</body>
</html>
