<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Industrial OS - Ingeniero André V17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Nunito:wght@400;900&display=swap');
        :root { --safety-orange: #ff6b00; --industrial-dark: #121212; }
        body { margin: 0; overflow: hidden; background-color: #000; color: var(--safety-orange); font-family: 'Nunito', sans-serif; }
        
        /* Contenedores Principales */
        .viewport { height: 65vh; position: relative; overflow: hidden; background: var(--industrial-dark); border-bottom: 6px solid var(--safety-orange); }
        .terminal { height: 35vh; background: #000; padding: 25px; font-family: 'Fira Code', monospace; overflow-y: auto; border-top: 2px solid #222; }
        
        /* Elementos de Interfaz */
        .guide-overlay { position: absolute; font-size: 30vw; opacity: 0.15; color: var(--safety-orange); font-weight: 900; pointer-events: none; }
        .industrial-popup { position: absolute; width: 380px; border-radius: 35px; border: 8px solid var(--safety-orange); z-index: 100; animation: vroom 2.8s linear forwards; box-shadow: 0 0 30px rgba(255,107,0,0.4); }
        @keyframes vroom { from { left: -500px; } to { left: 115%; } }
        
        /* Efectos Visuales Especiales */
        .hazard-overlay { position: absolute; inset: 0; pointer-events: none; display: none; }
        .asbesto-smoke { background: rgba(100,100,100,0.4); animation: flicker 0.2s infinite; }
        .water-cascade { background: linear-gradient(to bottom, transparent, rgba(0, 150, 255, 0.3)); }
        @keyframes flicker { 0% { opacity: 0.3; } 50% { opacity: 0.5; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <!-- PANTALLA DE ACCESO BIOMÉTRICO (ECOSAVE SECURITY) -->
    <div id="security-lock" class="fixed inset-0 bg-black z-[1000] flex flex-col items-center justify-center text-center">
        <h1 class="text-6xl font-black text-white mb-2 italic">ECOSAVE <span class="text-orange-500">SYSTEMS</span></h1>
        <p class="text-gray-500 font-bold mb-8 tracking-[0.3em]">INDUSTRIAL REMEDIATION DIVISION</p>
        
        <div id="scanner-box" class="hidden w-80 h-80 rounded-[3rem] border-8 border-orange-500 overflow-hidden mb-10 shadow-[0_0_80px_rgba(255,107,0,0.3)]">
            <video id="webcam" autoplay muted playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
        </div>
        
        <p id="status-text" class="text-orange-400 text-2xl font-black animate-pulse mb-8 italic uppercase">Esperando Identificación del Ingeniero...</p>
        
        <button onclick="accessRequest()" class="bg-orange-600 hover:bg-white text-white hover:text-orange-600 px-16 py-8 rounded-2xl font-black text-3xl uppercase transition-all shadow-2xl active:scale-95">
            Autorizar Ingeniero André
        </button>
    </div>
    <canvas id="snapshot" class="hidden"></canvas>

    <!-- INTERFAZ DE COMANDO INDUSTRIAL -->
    <div class="flex flex-col h-screen">
        <div class="viewport" id="stage">
            <div id="fx-layer" class="hazard-overlay"></div>
            <div id="guide-letter" class="guide-overlay inset-0 flex items-center justify-center"></div>
            <div id="main-icon" class="h-full flex items-center justify-center text-[15rem] drop-shadow-2xl">🤠</div>
        </div>

        <div class="terminal">
            <div class="flex justify-between items-center border-b-4 border-orange-900 pb-4 mb-4">
                <div class="flex flex-col">
                    <span class="text-gray-600 text-xs font-bold uppercase tracking-widest">Estado de la Misión</span>
                    <div id="current-task" class="text-orange-500 font-black text-4xl italic leading-none">STANDBY</div>
                </div>
                <div class="bg-orange-950 border-2 border-orange-500 px-8 py-4 rounded-2xl">
                    <span class="text-white font-black text-3xl" id="xp-meter">0</span>
                    <span class="text-orange-400 font-bold ml-2">PTS</span>
                </div>
            </div>
            <div id="event-log" class="text-gray-400 text-xl overflow-y-auto h-32"></div>
        </div>
    </div>

    <script>
        let videoStream, points = 0, currentTarget = "ANDRE", step = 0;
        const mainIcon = document.getElementById('main-icon');
        const fxLayer = document.getElementById('fx-layer');
        const log = document.getElementById('event-log');

        function speak(text) { window.speechSynthesis.cancel(); const msg = new SpeechSynthesisUtterance(text); msg.lang='es-MX'; msg.rate=0.9; window.speechSynthesis.speak(msg); }
        function writeLog(text) { log.innerHTML = `<div class="mb-1 border-l-4 border-orange-700 pl-3"><span class="text-orange-800">[CMD]</span> ${text}</div>${log.innerHTML}`; }

        // --- SISTEMA DE ACCESO ---
        async function accessRequest() {
            if(!videoStream) {
                videoStream = await navigator.mediaDevices.getUserMedia({video:true});
                document.getElementById('webcam').srcObject = videoStream;
                document.getElementById('scanner-box').classList.remove('hidden');
                document.getElementById('status-text').innerText = "VISTA DETECTADA. ENTER PARA CAPTURA.";
                speak("Ingeniero André, mire a la cámara para el acceso industrial.");
            } else {
                const video = document.getElementById('webcam'), canvas = document.getElementById('snapshot');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const downloader = document.createElement('a');
                downloader.href = canvas.toDataURL('image/jpeg');
                downloader.download = 'ID_INGENIERO_ANDRE.jpg';
                downloader.click();
                
                document.getElementById('security-lock').classList.add('hidden');
                speak("Acceso Concedido. Bienvenido al mando de ECOSAVE MX y Hacienda Soapayuca.");
                nextGoal();
            }
        }

        // --- LÓGICA DE LA ACADEMIA ---
        function nextGoal() {
            const missions = ["ASBESTO", "GASES", "RESIDUOS", "QUITOSANO", "ANDRE", "CABALLO", "JETTA", "MAZDA", "BUICK", "PICKUP", "SOPA", "1234"];
            currentTarget = missions[Math.floor(Math.random() * missions.length)];
            step = 0;
            document.getElementById('current-task').innerText = currentTarget;
            document.getElementById('guide-letter').innerText = currentTarget[0];
            speak("Comando: " + currentTarget);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !document.getElementById('security-lock').classList.contains('hidden')) {
                accessRequest(); return;
            }

            const input = e.key.toUpperCase();

            // 1. APRENDIZAJE DE TECLAS
            if (input === currentTarget[step] || e.key === currentTarget[step]) {
                step++;
                speak(e.key);
                if (step >= currentTarget.length) {
                    points += 100;
                    document.getElementById('xp-meter').innerText = points;
                    speak("¡Excelente trabajo, Ingeniero!");
                    writeLog(`Misión ${currentTarget} completada (+100 PTS)`);
                    nextGoal();
                } else {
                    document.getElementById('guide-letter').innerText = currentTarget[step];
                }
            }

            // 2. COMANDOS ECOLÓGICOS (ECOSAVE MX)
            if (input === 'A') { speak("Remoción de Asbesto activada."); mainIcon.innerText = "🏗️⚠️"; runFX('asbesto-smoke'); }
            if (input === 'G') { speak("Gestión de Gases Refrigerantes."); mainIcon.innerText = "💨🔋"; }
            if (input === 'Q') { speak("Aplicando Quitosano. Agua purificada."); mainIcon.innerText = "🧪💧"; }
            if (input === 'P') { speak("Control de Residuos Peligrosos."); mainIcon.innerText = "☢️📦"; }

            // 3. COMANDOS DE LA HACIENDA (SOAPAYUCA)
            if (input === 'R') { speak("Ricardo, el Jetta negro."); launchObj('jetta.jpg', '🚗'); }
            if (input === 'K') { speak("Kike, la Buick dorada."); launchObj('buick.jpg', '🚙'); }
            if (input === 'T') { speak("Tony, la pick up blanca."); launchObj('pickup.jpg', '🛻'); }
            if (input === 'M') { speak("Mazda de Mamá."); launchObj('mazda.jpg', '🏎️'); }
            if (input === 'V') { speak("¡Arre vaquero! Galopando."); mainIcon.innerText = "🤠🐎"; }
            if (input === 'D') { speak("Rescate de dinosaurio."); mainIcon.innerText = "🦕💦"; runFX('water-cascade'); }
            if (input === 'S') { speak("Sopa lista, Ingeniero."); mainIcon.innerText = "🥣"; }
            if (e.code === 'Space') { speak("¡Caballo a la fuente!"); launchObj('', '🐴💦'); }
        });

        function runFX(type) {
            fxLayer.className = `hazard-overlay ${type}`;
            fxLayer.style.display = 'block';
            setTimeout(() => fxLayer.style.display = 'none', 3000);
        }

        function launchObj(img, emoji) {
            const obj = document.createElement('div');
            obj.className = 'industrial-popup';
            obj.style.top = (Math.random() * 40 + 10) + '%';
            if (img) {
                obj.innerHTML = `<img src="${img}" style="width:100%" onerror="this.outerHTML='<span style=\'font-size:200px\'>${emoji}</span>'">`;
            } else {
                obj.innerHTML = `<span style="font-size:200px">${emoji}</span>`;
            }
            document.getElementById('stage').appendChild(obj);
            setTimeout(() => obj.remove(), 2800);
        }
    </script>
</body>
</html>
